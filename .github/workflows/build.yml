name: Build MedCase APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Olası tarayıcı çevirilerini otomatik düzeltme adımı
      - name: Dosya Kontrolü
        run: |
          if [ -d "kütüphane" ]; then mv kütüphane lib; fi
          if [ -f "lib/ana.dart" ]; then mv lib/ana.dart lib/main.dart; fi
          ls -la

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: MedCase-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
